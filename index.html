<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Transcriber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f8;
    --card: #ffffff;
    --ink: #1a2142;
    --muted: #5f6a8c;
    --line: #dde2f0;
    --accent: #3b3fd8;
    --accent-ink: #ffffff;
    --rec: #e5384f;
    --result-bg: #f6f7fc;
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12152b;
      --card: #1b2040;
      --ink: #eef0fb;
      --muted: #9aa3c7;
      --line: #2c3361;
      --accent: #7f83ff;
      --accent-ink: #12152b;
      --rec: #ff6178;
      --result-bg: #151a35;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    padding: 56px 20px;
  }
  header { text-align: center; margin-bottom: 32px; }
  h1 { font-size: clamp(2rem, 6vw, 3rem); font-weight: 800; letter-spacing: -0.03em; margin: 0 0 8px; }
  header p { margin: 0; color: var(--muted); font-size: 1.05rem; }
 
  main {
    width: 100%; max-width: 560px; background: var(--card);
    border: 1px solid var(--line); border-radius: 24px;
    padding: 32px; box-shadow: 0 12px 40px rgba(26, 33, 66, 0.08);
  }
 
  .status { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .status.recording .dot { background: var(--rec); animation: pulse 1.4s ease-out infinite; }
  .status.busy .dot { background: var(--accent); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--rec) 55%, transparent); }
    100% { box-shadow: 0 0 0 14px transparent; }
  }
  #statusText { font-weight: 600; color: var(--muted); }
  #timer { font-variant-numeric: tabular-nums; font-size: 2.4rem; font-weight: 800; letter-spacing: -0.02em; }
 
  .controls { display: flex; gap: 12px; justify-content: center; }
  button {
    font: inherit; font-weight: 700; border: 0; cursor: pointer;
    padding: 14px 28px; border-radius: 999px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  #start { background: var(--accent); color: var(--accent-ink); }
  #stop { background: transparent; color: var(--rec); box-shadow: inset 0 0 0 2px var(--rec); }
  .controls { flex-wrap: wrap; }
  #upload { background: var(--result-bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

  #confirm {
    margin-top: 20px; padding: 16px 18px; border-radius: 14px;
    background: var(--result-bg); border: 1px solid var(--line); text-align: center;
  }
  #confirm[hidden] { display: none; }
  #confirm p { margin: 0 0 12px; overflow-wrap: anywhere; }
  #confirm .meta { color: var(--muted); font-size: 0.9rem; }
  #confirm .btn-group { justify-content: center; }
  #confirm button { padding: 8px 18px; font-size: 0.9rem; }
  #useFile { background: var(--accent); color: var(--accent-ink); }
  #cancelFile { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  #uploadError { margin: 12px 0 0; color: var(--rec); font-weight: 600; text-align: center; }
  #uploadError:empty { display: none; }

  .result-head { display: flex; justify-content: space-between; align-items: center; margin: 32px 0 10px; }
  .result-head h2 { margin: 0; font-size: 1.05rem; }
  .btn-group { display: flex; gap: 8px; }
  #summarize { padding: 6px 14px; font-size: 0.85rem; background: var(--accent); color: var(--accent-ink); }
  #copy, #copySummary { padding: 6px 14px; font-size: 0.85rem; background: var(--result-bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  #result, #summary {
    margin: 0; padding: 18px; min-height: 120px; border-radius: 14px;
    background: var(--result-bg); border: 1px solid var(--line);
    white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; line-height: 1.6;
    width: 100%; max-height: 360px; overflow-y: auto;
  }
  #result.empty, #summary.empty { color: var(--muted); }

  #speakers { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 10px; }
  #speakers[hidden] { display: none; }
  #speakers label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
  #speakers input {
    font: inherit; font-size: 0.85rem; color: var(--ink); width: 9em;
    padding: 5px 10px; border-radius: 999px;
    background: var(--result-bg); border: 1px solid var(--line);
  }
  #speakers input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
 
  @media (prefers-reduced-motion: reduce) {
    .status.recording .dot { animation: none; }
    button { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>Meeting Transcriber</h1>
    <p>Record or upload your meeting, get the text.</p>
  </header>
 
  <main>
    <div class="status" id="status">
      <span class="dot"></span>
      <span id="statusText">Ready to record</span>
    </div>
    <div style="text-align:center; margin-bottom:24px;"><span id="timer">00:00</span></div>
 
    <div class="controls">
      <button id="start">Start recording</button>
      <button id="stop" disabled>Stop and transcribe</button>
      <button id="upload">Upload audio file</button>
      <input type="file" id="fileInput" accept="audio/*,video/*" hidden>
    </div>
    <p id="uploadError" role="alert"></p>

    <div id="confirm" hidden>
      <p>Use <strong id="fileName"></strong> for transcription?<br>
        <span class="meta" id="fileMeta"></span></p>
      <div class="btn-group">
        <button id="useFile">Transcribe this file</button>
        <button id="cancelFile">Cancel</button>
      </div>
    </div>
 
    <div class="result-head">
      <h2>Transcript</h2>
      <button id="copy" data-target="result">Copy</button>
    </div>
    <div id="speakers" hidden></div>
    <pre id="result" class="empty">Your transcript will appear here.</pre>
 
    <div class="result-head">
      <h2>Summary</h2>
      <div class="btn-group">
        <button id="summarize" disabled>Summarize</button>
        <button id="copySummary" data-target="summary">Copy</button>
      </div>
    </div>
    <pre id="summary" class="empty">Click "Summarize" after transcribing.</pre>
  </main>

<script>
  const FIELD_NAME = "audio";

  const startBtn = document.getElementById("start");
  const stopBtn = document.getElementById("stop");
  const copyBtn = document.getElementById("copy");
  const resultEl = document.getElementById("result");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");
  const timerEl = document.getElementById("timer");
  const summaryEl = document.getElementById("summary");
  const summarizeBtn = document.getElementById("summarize");

  const speakersEl = document.getElementById("speakers");

  const uploadBtn = document.getElementById("upload");
  const fileInput = document.getElementById("fileInput");
  const uploadErrorEl = document.getElementById("uploadError");
  const confirmEl = document.getElementById("confirm");
  const fileNameEl = document.getElementById("fileName");
  const fileMetaEl = document.getElementById("fileMeta");
  const useFileBtn = document.getElementById("useFile");
  const cancelFileBtn = document.getElementById("cancelFile");

  let recorder, chunks = [], timerId, startedAt;
  let segments = [], names = {};

  // Render the transcript from diarized segments, using the user's names.
  function renderTranscript() {
    showResult(segments.map(s => (names[s.speaker] || s.speaker) + ": " + s.text).join("\n"));
  }

  function showSpeakers(segs) {
    segments = segs || [];
    names = {};
    speakersEl.replaceChildren();
    const unique = [...new Set(segments.map(s => s.speaker))];
    speakersEl.hidden = unique.length === 0;
    unique.forEach(speaker => {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.placeholder = speaker;
      input.setAttribute("aria-label", "Name for " + speaker);
      input.oninput = () => {
        names[speaker] = input.value.trim();
        renderTranscript();
      };
      label.append(speaker, input);
      speakersEl.append(label);
    });
  }

  function setStatus(kind, text) {
    statusEl.className = "status " + kind;
    statusText.textContent = text;
  }

  function showResult(text, isEmpty = false) {
    resultEl.textContent = text;
    resultEl.classList.toggle("empty", isEmpty);
  }

  function tick() {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    timerEl.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  function showSummary(text, isEmpty = false) {
    summaryEl.textContent = text;
    summaryEl.classList.toggle("empty", isEmpty);
  }

  startBtn.onclick = async () => {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      setStatus("", "Microphone blocked. Allow access in your browser and try again.");
      return;
    }

    recorder = new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);

    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: recorder.mimeType });
      transcribeBlob(blob, "recording.webm");
    };

    hideConfirm();
    uploadErrorEl.textContent = "";
    recorder.start();
    summarizeBtn.disabled = true;
    startedAt = Date.now();
    timerEl.textContent = "00:00";
    timerId = setInterval(tick, 500);
    setStatus("recording", "Recording");
    startBtn.disabled = true;
    uploadBtn.disabled = true;
    stopBtn.disabled = false;
  };

  stopBtn.onclick = () => {
    clearInterval(timerId);
    recorder.stop();
    recorder.stream.getTracks().forEach(t => t.stop());
    stopBtn.disabled = true;
  };

  // Shared by recording and upload: send audio to /transcribe and show the result.
  async function transcribeBlob(blob, filename) {
    startBtn.disabled = true;
    uploadBtn.disabled = true;
    summarizeBtn.disabled = true;
    setStatus("busy", "Transcribing and identifying speakers...");
    showSpeakers([]);
    showResult("Working on it...", true);
    const form = new FormData();
    form.append(FIELD_NAME, blob, filename);
    try {
      const res = await fetch("/transcribe", { method: "POST", body: form });
      if (!res.ok) {
        let detail = "Server returned " + res.status;
        try { detail = (await res.json()).detail || detail; } catch {}
        throw new Error(detail);
      }
      const data = await res.json();
      showSpeakers(data.segments);
      if (segments.length) renderTranscript();
      else showResult(data.text || "No speech detected.", !data.text);
      summarizeBtn.disabled = !data.text;
      setStatus("", "Transcribed. Click Summarize for a summary.");
    } catch (err) {
      showResult("Something went wrong: " + err.message, true);
      setStatus("", "Transcription failed");
    }
    startBtn.disabled = false;
    uploadBtn.disabled = false;
  }

  // Upload an existing sound file. The file picker is the browser's permission;
  // the confirm panel asks the user to explicitly approve using the chosen file.
  let uploadRules = { extensions: [], max_mb: null };
  fetch("/upload-config").then(r => r.json()).then(rules => {
    uploadRules = rules;
    fileInput.accept = ["audio/*", "video/*", ...rules.extensions].join(",");
  }).catch(() => {});

  let pendingFile = null;

  function formatSize(bytes) {
    return bytes >= 1024 * 1024
      ? (bytes / 1024 / 1024).toFixed(1) + " MB"
      : Math.max(1, Math.round(bytes / 1024)) + " KB";
  }

  function formatDuration(sec) {
    sec = Math.round(sec);
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const mm = String(m).padStart(h ? 2 : 1, "0"), ss = String(s).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  function hideConfirm() {
    pendingFile = null;
    fileInput.value = "";
    confirmEl.hidden = true;
  }

  // Returns an error message, or "" when the file looks usable.
  function checkFile(file) {
    const dot = file.name.lastIndexOf(".");
    const ext = dot >= 0 ? file.name.slice(dot).toLowerCase() : "";
    if (uploadRules.extensions.length && !uploadRules.extensions.includes(ext)) {
      return `"${file.name}" is not a supported sound file. Supported: ${uploadRules.extensions.join(", ")}`;
    }
    if (file.size === 0) return `"${file.name}" is empty.`;
    if (uploadRules.max_mb && file.size > uploadRules.max_mb * 1024 * 1024) {
      return `"${file.name}" is ${formatSize(file.size)}; the limit is ${uploadRules.max_mb} MB.`;
    }
    return "";
  }

  uploadBtn.onclick = () => fileInput.click();

  fileInput.onchange = () => {
    const file = fileInput.files[0];
    uploadErrorEl.textContent = "";
    if (!file) return hideConfirm();
    const error = checkFile(file);
    if (error) {
      hideConfirm();
      uploadErrorEl.textContent = error;
      return;
    }
    pendingFile = file;
    fileNameEl.textContent = file.name;
    fileMetaEl.textContent = formatSize(file.size) + " · reading duration...";
    confirmEl.hidden = false;
    useFileBtn.focus();

    // Duration is informational only; the server decides whether it can decode the file.
    const url = URL.createObjectURL(file);
    const probe = new Audio();
    const done = text => {
      if (pendingFile === file) fileMetaEl.textContent = formatSize(file.size) + " · " + text;
      URL.revokeObjectURL(url);
    };
    probe.onloadedmetadata = () =>
      done(isFinite(probe.duration) ? formatDuration(probe.duration) : "duration unknown");
    probe.onerror = () => done("duration unknown");
    probe.preload = "metadata";
    probe.src = url;
  };

  useFileBtn.onclick = () => {
    const file = pendingFile;
    hideConfirm();
    if (file) transcribeBlob(file, file.name);
  };

  cancelFileBtn.onclick = () => {
    hideConfirm();
    uploadBtn.focus();
  };

summarizeBtn.onclick = async () => {
    summarizeBtn.disabled = true;
    setStatus("busy", "Summarizing...");
    showSummary("Working on it...", true);
    try {
      const res = await fetch("/summarize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ transcript: resultEl.textContent }),
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();
      console.log("summarize response:", data);
      showSummary(
        data.summary || "The server returned an empty summary. Check the uvicorn terminal.",
        !data.summary
      );
      setStatus("", "Done. Ready to record again.");
    } catch (err) {
      showSummary("Something went wrong: " + err.message, true);
      setStatus("", "Summary failed");
    }
    summarizeBtn.disabled = false;
  };

  [copyBtn, document.getElementById("copySummary")].forEach(btn => {
    btn.onclick = async () => {
      const target = document.getElementById(btn.dataset.target);
      if (target.classList.contains("empty")) return;
      await navigator.clipboard.writeText(target.textContent);
      btn.textContent = "Copied";
      setTimeout(() => (btn.textContent = "Copy"), 1500);
    };
  });

</script>
</body>
</html>
